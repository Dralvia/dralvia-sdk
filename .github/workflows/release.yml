# Publishes a tagged release (vX.Y.Z) to PyPI and npm.
#
# Both registries use Trusted Publishing: GitHub proves to PyPI and npm that the
# upload comes from this workflow, so no publishing token is stored anywhere.
# PyPI files get a signed Sigstore attestation that `pypi-attestations` can
# verify, and npm attaches provenance that links the package to this run.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  pypi:
    name: Publish dralvia-sdk to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Test and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" twine
          pytest tests
          python -m build
          python -m twine check dist/*
      # A version that was uploaded by hand (0.3.0 was) is left as it is.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          attestations: true
          skip-existing: true

  npm:
    name: Publish @dralvia/sdk to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Trusted Publishing needs npm 11.5.1 or later; Node 20 ships npm 10.
      - run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npm test
      - name: Publish unless this version is already on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@dralvia/sdk@$version" version >/dev/null 2>&1; then
            echo "@dralvia/sdk@$version is already on npm, nothing to publish."
          else
            npm publish --provenance --access public
          fi
